name: Windows Portable Experience
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows portable executable
        run: pnpm tauri build --no-bundle
      - name: Collect portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item src-tauri/target/release/huangguo-client.exe artifacts/HGhub.exe
          Copy-Item LICENSE artifacts/LICENSE.txt
          Get-FileHash artifacts/HGhub.exe -Algorithm SHA256 | Format-List | Out-File artifacts/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-Windows-portable
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
