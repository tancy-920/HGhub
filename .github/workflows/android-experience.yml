name: Android Personal APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-personal-arm64
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Initialize Android project
        run: pnpm tauri android init --ci
      - name: Build ARM64 APK
        run: pnpm tauri android build --apk --split-per-abi --target aarch64
      - name: Sign and verify APK
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.HG_ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.HG_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/hghub-personal.p12"
          trap 'rm -f "$KS"' EXIT
          printf "%s" "$SIGNING_KEY" | base64 -d > "$KS"
          chmod 600 "$KS"
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -name "*-release*.apk")
          test "${#APKS[@]}" -eq 1
          mkdir -p artifacts
          OUT="artifacts/HGhub_1.2.1_arm64-v8a.apk"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -f -p 4 "${APKS[0]}" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-type PKCS12 --ks-pass env:SIGNING_PASSWORD --key-pass env:SIGNING_PASSWORD --v4-signing-enabled false --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" > artifacts/verification.txt
          "$BT/aapt" dump badging "$OUT" >> artifacts/verification.txt
          grep -E "Verified|Signer #1 certificate|package:|sdkVersion|targetSdkVersion|native-code:" artifacts/verification.txt
          (cd artifacts && sha256sum *.apk > SHA256.txt)
          cp LICENSE artifacts/LICENSE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HGhub-Android-arm64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
